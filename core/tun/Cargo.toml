[package]
name = "vdpi-tun"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shared pure-Rust userspace TUN anti-DPI engine for Desktop, Android, and iOS powered by vdpi-core"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["dpi", "tun", "smoltcp", "doh", "network"]
categories = ["network-programming"]

[dependencies]
anyhow = "1.0"
etherparse = "0.16"
futures = "0.3"
netstack-smoltcp = "0.2.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
vdpi-core.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

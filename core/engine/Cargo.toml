[package]
name = "vdpi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Core pure-Rust anti-DPI TLS desync, DoH DNS, and bypass engine for vdpi"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["dpi", "tls", "doh", "network", "anti-censorship"]
categories = ["network-programming"]

[features]
default = []
cli = ["dep:clap"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
webpki-roots = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
rcgen = "0.13"

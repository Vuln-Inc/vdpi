[package]
name = "vdpi-ios"
version = "0.3.0"
edition = "2021"
authors = ["Vuln-Inc"]
description = "iOS NEPacketTunnelProvider C-ABI static library powered by vdpi-tun"
license = "MIT"

[lib]
name = "vdpi_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "sync", "time"] }
vdpi = { path = "../.." }
vdpi-tun = { path = "../vdpi-tun" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
etherparse = "0.16"

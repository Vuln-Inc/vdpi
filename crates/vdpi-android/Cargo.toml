[package]
name = "vdpi-android"
version = "0.3.0"
edition = "2021"
authors = ["Vuln-Inc"]
description = "Android TUN + JNI anti-DPI tunnel engine powered by vdpi"
license = "MIT"

[lib]
name = "vdpi_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "sync", "time"] }
vdpi = { path = "../.." }
vdpi-tun = { path = "../vdpi-tun" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

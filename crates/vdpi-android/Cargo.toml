[package]
name = "vdpi-android"
version = "0.3.0"
edition = "2021"
authors = ["Vuln-Inc"]
description = "Android TUN + JNI anti-DPI tunnel engine powered by vdpi"
license = "MIT"

[lib]
name = "vdpi_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
etherparse = "0.16"
futures = "0.3"
netstack-smoltcp = "0.2.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
vdpi = { path = "../.." }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

name: Vdpi
options:
  bundleIdPrefix: com.vulninc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "7"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    APPLICATION_EXTENSION_API_ONLY: "NO"

targets:
  VdpiApp:
    type: application
    platform: iOS
    sources:
      - path: VdpiApp
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vulninc.vdpi
        INFOPLIST_FILE: VdpiApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: VdpiApp/VdpiApp.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VdpiPacketTunnel
        embed: true
      - framework: Frameworks/VdpiCore.xcframework
        embed: false
        link: true
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework

  VdpiPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vulninc.vdpi.packet-tunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - framework: Frameworks/VdpiCore.xcframework
        embed: false
        link: true
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework

  VdpiAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VdpiAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: VdpiApp
      - framework: Frameworks/VdpiCore.xcframework
        embed: false
        link: false

schemes:
  VdpiApp:
    build:
      targets:
        VdpiApp: all
        VdpiPacketTunnel: all
        VdpiAppTests: [test]
    test:
      targets:
        - VdpiAppTests

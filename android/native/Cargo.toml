[package]
name = "vdpi-android"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Android TUN + JNI anti-DPI tunnel engine powered by vdpi"
license.workspace = true
publish = false

[lib]
name = "vdpi_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "sync", "time"] }
vdpi-core.workspace = true
vdpi-tun.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

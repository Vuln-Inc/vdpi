name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ios_only:
        description: "Build & verify iOS unsigned IPA only (saves CI minutes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.ios_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Manifest Version Parity
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import tomllib

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          desktop_cargo = tomllib.loads(pathlib.Path("desktop/src-tauri/Cargo.toml").read_text(encoding="utf-8"))
          tauri_conf = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          ui_pkg = json.loads(pathlib.Path("desktop/ui/package.json").read_text(encoding="utf-8"))
          ios_yml = pathlib.Path("ios/project.yml").read_text(encoding="utf-8")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          ios_match = re.search(r'^\s*MARKETING_VERSION:\s*"?([^"\s#]+)"?\s*$', ios_yml, re.M)
          if not ios_match:
              sys.exit("ERROR: Could not read MARKETING_VERSION from ios/project.yml")

          changelog_match = re.search(r'^## \[([0-9]+\.[0-9]+\.[0-9]+[^\]]*)\]', changelog, re.M)
          if not changelog_match:
              sys.exit("ERROR: Could not find latest version heading in CHANGELOG.md")

          versions = {
              "Cargo.toml": cargo["workspace"]["package"]["version"],
              "desktop/src-tauri/Cargo.toml": desktop_cargo["package"]["version"],
              "desktop/src-tauri/tauri.conf.json": tauri_conf["version"],
              "desktop/ui/package.json": ui_pkg["version"],
              "ios/project.yml": ios_match.group(1),
              "CHANGELOG.md": changelog_match.group(1),
          }

          tag = os.environ.get("RELEASE_TAG", "").strip()
          if tag:
              if not tag.startswith("v"):
                  sys.exit(f"ERROR: Release tag '{tag}' must start with 'v'")
              versions[f"tag ({tag})"] = tag[1:]

          for name, ver in versions.items():
              print(f"  {name}: {ver}")

          unique = set(versions.values())
          if len(unique) != 1:
              sys.exit(f"ERROR: Version mismatch across manifests: {versions}")

          print(f"Verified manifest version parity: {next(iter(unique))}")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Verify Mobile & Cross-OS Crate Isolation
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          FORBIDDEN='^(vdpi|ratatui|crossterm|clap|windows-sys) '
          check_isolation() {
            local pkg="$1"
            local target="$2"
            echo "Checking crate isolation: ${pkg} (${target})"
            local tree
            tree="$(cargo tree --locked -p "${pkg}" --target "${target}" -e normal --prefix none)"
            if [ -z "${tree}" ]; then
              echo "ERROR: cargo tree returned empty output for ${pkg} (${target})" >&2
              exit 1
            fi
            if printf '%s\n' "${tree}" | grep -E "${FORBIDDEN}"; then
              echo "ERROR: ${pkg} (${target}) pulled forbidden crate(s)" >&2
              exit 1
            fi
          }
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android x86_64-unknown-linux-gnu; do
            check_isolation vdpi-android "${target}"
          done
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin; do
            check_isolation vdpi-ios "${target}"
          done
      - name: Run Unit & Integration Tests
        run: cargo test --workspace --locked

  build-android:
    name: Build & Verify Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - name: Configure Android NDK Path
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Native Rust JNI Libraries
        run: |
          set -euo pipefail
          ./android/scripts/build-native.sh
      - name: Decode Optional Release Keystore
        env:
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          VDPI_KEYSTORE_BASE64: ${{ secrets.VDPI_KEYSTORE_BASE64 }}
          VDPI_KEYSTORE_PASSWORD: ${{ secrets.VDPI_KEYSTORE_PASSWORD }}
          VDPI_KEY_ALIAS: ${{ secrets.VDPI_KEY_ALIAS }}
          VDPI_KEY_PASSWORD: ${{ secrets.VDPI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG_RELEASE" = "true" ]; then
            missing=()
            [ -n "$VDPI_KEYSTORE_BASE64" ] || missing+=(VDPI_KEYSTORE_BASE64)
            [ -n "$VDPI_KEYSTORE_PASSWORD" ] || missing+=(VDPI_KEYSTORE_PASSWORD)
            [ -n "$VDPI_KEY_ALIAS" ] || missing+=(VDPI_KEY_ALIAS)
            [ -n "$VDPI_KEY_PASSWORD" ] || missing+=(VDPI_KEY_PASSWORD)
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "ERROR: Tagged release requires all 4 Android keystore secrets; missing: ${missing[*]}" >&2
              exit 1
            fi
          fi
          if [ -n "$VDPI_KEYSTORE_BASE64" ] && [ -n "$VDPI_KEYSTORE_PASSWORD" ] && [ -n "$VDPI_KEY_ALIAS" ] && [ -n "$VDPI_KEY_PASSWORD" ]; then
            echo "$VDPI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vdpi-release.jks"
            echo "VDPI_KEYSTORE_PATH=$RUNNER_TEMP/vdpi-release.jks" >> "$GITHUB_ENV"
          elif [ -n "$VDPI_KEYSTORE_BASE64" ]; then
            echo "WARNING: Partial Android keystore secrets on non-tag dispatch; falling back to debug keystore" >&2
          fi
      - name: Run Android Unit Tests, Lint & Assemble Release APK
        working-directory: android
        env:
          VDPI_KEYSTORE_PASSWORD: ${{ secrets.VDPI_KEYSTORE_PASSWORD }}
          VDPI_KEY_ALIAS: ${{ secrets.VDPI_KEY_ALIAS }}
          VDPI_KEY_PASSWORD: ${{ secrets.VDPI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon
      - name: Verify APK Native ABIs & Package Artifact
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$APK" | grep -q "lib/${abi}/libvdpi_android.so" || {
              echo "ERROR: Missing lib/${abi}/libvdpi_android.so in $APK" >&2
              exit 1
            }
          done
          mkdir -p dist/android
          cp "$APK" dist/android/vdpi-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/android/vdpi-android-universal.apk

  build-ios:
    name: Build & Test iOS App (XCFramework + Simulator)
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.ios_only)) }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen & ldid
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen ldid-procursus
      - name: Build VdpiCore.xcframework (Rust iOS + Simulator)
        run: ./ios/scripts/build-xcframework.sh
      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate
      - name: Build & Run XCTests on iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)
          def ver_key(rt):
              nums = [int(x) for x in re.findall(r'\d+', rt)]
              return tuple(nums)
          for runtime, devices in sorted(data.get('devices', {}).items(), key=lambda kv: ver_key(kv[0]), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using iOS Simulator UDID: $SIM_UDID"
          xcodebuild test \
            -project Vdpi.xcodeproj \
            -scheme VdpiApp \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""
      - name: Build Physical iOS arm64 Device App & Package Unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf build ../dist/ios
          xcodebuild build \
            -project Vdpi.xcodeproj \
            -scheme VdpiApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="build/Build/Products/Release-iphoneos/VdpiApp.app"
          APPEX_PATH="$APP_PATH/PlugIns/VdpiPacketTunnel.appex"
          test -d "$APP_PATH"
          test -d "$APPEX_PATH"

          # Ad-hoc sign with ldid so iOS arm64 entitlements and signing identifiers are preserved (required for TrollStore; re-signers replace this cleanly)
          ldid -Icom.vulninc.vdpi.packet-tunnel -SPacketTunnel/PacketTunnel.entitlements "$APPEX_PATH/VdpiPacketTunnel"
          ldid -Icom.vulninc.vdpi -SVdpiApp/VdpiApp.entitlements "$APP_PATH/VdpiApp"

          APPEX_ENTITLEMENTS="$(ldid -e "$APPEX_PATH/VdpiPacketTunnel")"
          printf '%s\n' "$APPEX_ENTITLEMENTS" >&2
          printf '%s\n' "$APPEX_ENTITLEMENTS" | grep -q "packet-tunnel-provider"
          printf '%s\n' "$APPEX_ENTITLEMENTS" | grep -q "group.com.vulninc.vdpi"

          APP_ENTITLEMENTS="$(ldid -e "$APP_PATH/VdpiApp")"
          printf '%s\n' "$APP_ENTITLEMENTS" >&2
          printf '%s\n' "$APP_ENTITLEMENTS" | grep -q "packet-tunnel-provider"
          printf '%s\n' "$APP_ENTITLEMENTS" | grep -q "group.com.vulninc.vdpi"

          mkdir -p ../dist/ios/ipa-stage/Payload
          cp -R "$APP_PATH" ../dist/ios/ipa-stage/Payload/VdpiApp.app
          (cd ../dist/ios/ipa-stage && zip -qry ../vdpi-ios-unsigned.ipa Payload)
          rm -rf ../dist/ios/ipa-stage build

          # Verify IPA layout contains both main app and embedded NetworkExtension
          unzip -l ../dist/ios/vdpi-ios-unsigned.ipa | grep -q "Payload/VdpiApp.app/Info.plist"
          unzip -l ../dist/ios/vdpi-ios-unsigned.ipa | grep -q "Payload/VdpiApp.app/PlugIns/VdpiPacketTunnel.appex/Info.plist"
          ls -lh ../dist/ios/vdpi-ios-unsigned.ipa
      - name: Package VdpiCore.xcframework Artifact
        run: |
          set -euo pipefail
          mkdir -p dist/ios
          ditto -c -k --sequesterRsrc --keepParent ios/Frameworks/VdpiCore.xcframework dist/ios/VdpiCore.xcframework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/ios/vdpi-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: dist/ios/VdpiCore.xcframework.zip

  build-windows:
    name: Package Windows (x86_64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Download & Verify Wintun 0.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wintunUrl = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $expectedZipSha256 = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $expectedDllSha256 = 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'
          $stageDir = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1'
          $zipPath = Join-Path $stageDir 'wintun-0.14.1.zip'
          $extractDir = Join-Path $stageDir 'extracted'

          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $wintunUrl -OutFile $zipPath -TimeoutSec 60
              break
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw "Failed to download $wintunUrl after $maxAttempts attempts: $($_.Exception.Message)"
              }
              Write-Warning "Attempt $attempt/$maxAttempts failed downloading Wintun ($($_.Exception.Message)); retrying..."
              Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds ($attempt * 3)
            }
          }

          $actualZipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZipSha256 -ne $expectedZipSha256) {
            throw "Wintun archive SHA-256 mismatch: expected $expectedZipSha256, got $actualZipSha256"
          }

          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force

          $dllPath = Join-Path $extractDir 'wintun/bin/amd64/wintun.dll'
          $licensePath = Join-Path $extractDir 'wintun/LICENSE.txt'
          if (-not (Test-Path -LiteralPath $dllPath)) {
            throw "Missing extracted Wintun DLL at $dllPath"
          }
          if (-not (Test-Path -LiteralPath $licensePath)) {
            throw "Missing extracted Wintun LICENSE at $licensePath"
          }

          $actualDllSha256 = (Get-FileHash -LiteralPath $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDllSha256 -ne $expectedDllSha256) {
            throw "wintun.dll SHA-256 mismatch: expected $expectedDllSha256, got $actualDllSha256"
          }

          $sig = Get-AuthenticodeSignature -FilePath $dllPath
          if ($sig.Status -ne 'Valid') {
            throw "wintun.dll Authenticode signature invalid: Status=$($sig.Status), Message=$($sig.StatusMessage)"
          }
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
          if ($subject -notmatch 'WireGuard LLC') {
            throw "wintun.dll Authenticode signer mismatch: expected WireGuard LLC, got '$subject'"
          }

          $resolvedDllPath = (Resolve-Path -LiteralPath $dllPath).Path
          $resolvedLicensePath = (Resolve-Path -LiteralPath $licensePath).Path
          "WINTUN_DLL_PATH=$resolvedDllPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINTUN_LICENSE_PATH=$resolvedLicensePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified wintun.dll SHA-256 ($actualDllSha256) and Authenticode signer ($subject); staged loose Wintun files for packaging"
      - name: Build Windows Release Binary
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VDPI_EMBED_WINTUN_DLL) {
            throw "VDPI_EMBED_WINTUN_DLL must not be set for official Windows release builds"
          }
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin vdpi
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build vdpi.exe failed with exit code $LASTEXITCODE"
          }
      - name: Package Windows Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINTUN_DLL_PATH -or -not (Test-Path -LiteralPath $env:WINTUN_DLL_PATH)) {
            throw "WINTUN_DLL_PATH is missing or invalid: '$($env:WINTUN_DLL_PATH)'"
          }
          if (-not $env:WINTUN_LICENSE_PATH -or -not (Test-Path -LiteralPath $env:WINTUN_LICENSE_PATH)) {
            throw "WINTUN_LICENSE_PATH is missing or invalid: '$($env:WINTUN_LICENSE_PATH)'"
          }

          Remove-Item -LiteralPath dist/win -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist/win | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/vdpi.exe -Destination dist/win/vdpi.exe
          Copy-Item -LiteralPath $env:WINTUN_DLL_PATH -Destination dist/win/wintun.dll
          Copy-Item -LiteralPath $env:WINTUN_LICENSE_PATH -Destination dist/win/WINTUN-LICENSE.txt

          $verInfo = (Get-Item -LiteralPath dist/win/vdpi.exe).VersionInfo
          if ([string]::IsNullOrWhiteSpace($verInfo.ProductName) -or $verInfo.ProductName -ne 'vdpi') {
            throw "Expected dist/win/vdpi.exe PE ProductName == 'vdpi', got '$($verInfo.ProductName)'"
          }
          if ([string]::IsNullOrWhiteSpace($verInfo.CompanyName) -or $verInfo.CompanyName -ne 'Vuln-Inc') {
            throw "Expected dist/win/vdpi.exe PE CompanyName == 'Vuln-Inc', got '$($verInfo.CompanyName)'"
          }
          Write-Host "Verified PE VersionInfo: ProductName='$($verInfo.ProductName)', CompanyName='$($verInfo.CompanyName)', FileDescription='$($verInfo.FileDescription)', ProductVersion='$($verInfo.ProductVersion)'"

          Compress-Archive -Path dist/win/* -DestinationPath dist/vdpi-windows-x86_64.zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/vdpi-windows-x86_64.zip').Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            $expected = @('vdpi.exe', 'wintun.dll', 'WINTUN-LICENSE.txt')
            $diff = @(Compare-Object -ReferenceObject $expected -DifferenceObject $entries -CaseSensitive)
            if ($entries.Count -ne $expected.Count -or $diff.Count -ne 0) {
              throw "Expected dist/vdpi-windows-x86_64.zip to contain $($expected -join ', '), got: $($entries -join ', ')"
            }
          } finally {
            $zip.Dispose()
          }
          Write-Host "Verified Windows release archive (vdpi.exe + loose WHQL-signed wintun.dll + WINTUN-LICENSE.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/vdpi-windows-x86_64.zip

  build-macos:
    name: Package macOS (Universal)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build Universal macOS Binary
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p dist/mac
          lipo -create -output dist/mac/vdpi \
            target/aarch64-apple-darwin/release/vdpi \
            target/x86_64-apple-darwin/release/vdpi
          chmod 755 dist/mac/vdpi
          codesign -fs - dist/mac/vdpi
          cp README.md LICENSE dist/mac/
          COPYFILE_DISABLE=1 tar -czf dist/vdpi-macos-universal.tar.gz -C dist/mac vdpi README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/vdpi-macos-universal.tar.gz

  build-linux:
    name: Package Linux (x86_64 & arm64 musl)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install Cross Toolchains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Build & Package Static Linux Binaries
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-musl
          CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
          cargo build --locked --release --target aarch64-unknown-linux-musl

          mkdir -p dist/lin64 dist/linarm
          cp target/x86_64-unknown-linux-musl/release/vdpi dist/lin64/vdpi
          chmod 755 dist/lin64/vdpi
          cp README.md LICENSE dist/lin64/
          tar -czf dist/vdpi-linux-x86_64.tar.gz -C dist/lin64 vdpi README.md LICENSE

          cp target/aarch64-unknown-linux-musl/release/vdpi dist/linarm/vdpi
          chmod 755 dist/linarm/vdpi
          cp README.md LICENSE dist/linarm/
          tar -czf dist/vdpi-linux-arm64.tar.gz -C dist/linarm vdpi README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/vdpi-linux-x86_64.tar.gz
            dist/vdpi-linux-arm64.tar.gz

  test-desktop:
    name: Test Desktop GUI (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.ios_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> desktop/src-tauri/target
          shared-key: desktop-test-${{ matrix.os }}
      - name: Install WebKitGTK & Ayatana AppIndicator Dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Run Desktop UI Typecheck, Unit Tests & Build
        working-directory: desktop/ui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test
          npm run build
      - name: Run Desktop Tauri Clippy & Unit Tests
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build-desktop-windows:
    name: Build Desktop GUI (Windows x86_64)
    needs: [test, test-desktop]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> desktop/src-tauri/target
          shared-key: desktop-windows
      - name: Download & Verify Wintun 0.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wintunUrl = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $expectedZipSha256 = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          $expectedDllSha256 = 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'
          $stageDir = Join-Path $env:RUNNER_TEMP 'wintun-desktop-0.14.1'
          $zipPath = Join-Path $stageDir 'wintun-0.14.1.zip'
          $extractDir = Join-Path $stageDir 'extracted'

          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $wintunUrl -OutFile $zipPath -TimeoutSec 60
              break
            } catch {
              if ($attempt -eq $maxAttempts) {
                throw "Failed to download $wintunUrl after $maxAttempts attempts: $($_.Exception.Message)"
              }
              Write-Warning "Attempt $attempt/$maxAttempts failed downloading Wintun ($($_.Exception.Message)); retrying..."
              Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds ($attempt * 3)
            }
          }

          $actualZipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualZipSha256 -ne $expectedZipSha256) {
            throw "Wintun archive SHA-256 mismatch: expected $expectedZipSha256, got $actualZipSha256"
          }

          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force

          $dllPath = Join-Path $extractDir 'wintun/bin/amd64/wintun.dll'
          $licensePath = Join-Path $extractDir 'wintun/LICENSE.txt'
          if (-not (Test-Path -LiteralPath $dllPath)) {
            throw "Missing extracted Wintun DLL at $dllPath"
          }
          if (-not (Test-Path -LiteralPath $licensePath)) {
            throw "Missing extracted Wintun LICENSE at $licensePath"
          }

          $actualDllSha256 = (Get-FileHash -LiteralPath $dllPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDllSha256 -ne $expectedDllSha256) {
            throw "wintun.dll SHA-256 mismatch: expected $expectedDllSha256, got $actualDllSha256"
          }

          $sig = Get-AuthenticodeSignature -FilePath $dllPath
          if ($sig.Status -ne 'Valid') {
            throw "wintun.dll Authenticode signature invalid: Status=$($sig.Status), Message=$($sig.StatusMessage)"
          }
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' }
          if ($subject -notmatch 'WireGuard LLC') {
            throw "wintun.dll Authenticode signer mismatch: expected WireGuard LLC, got '$subject'"
          }

          $resolvedDllPath = (Resolve-Path -LiteralPath $dllPath).Path
          $resolvedLicensePath = (Resolve-Path -LiteralPath $licensePath).Path
          "WINTUN_DLL_PATH=$resolvedDllPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINTUN_LICENSE_PATH=$resolvedLicensePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified wintun.dll SHA-256 ($actualDllSha256) and Authenticode signer ($subject); staged loose Wintun files for desktop packaging"
      - name: Build Windows CLI Engine Binary (vdpi.exe)
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VDPI_EMBED_WINTUN_DLL) {
            throw "VDPI_EMBED_WINTUN_DLL must not be set for official Windows release builds"
          }
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin vdpi
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build vdpi.exe failed with exit code $LASTEXITCODE"
          }
      - name: Install Desktop UI Dependencies & Verify Pinned Tauri CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm --prefix desktop/ui ci
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed with exit code $LASTEXITCODE"
          }
          npx --prefix desktop/ui tauri --version
          if ($LASTEXITCODE -ne 0) {
            throw "tauri --version failed with exit code $LASTEXITCODE"
          }
      - name: Verify Desktop & CLI Version Parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cliBin = 'target/x86_64-pc-windows-msvc/release/vdpi.exe'
          if (-not (Test-Path -LiteralPath $cliBin)) {
            throw "Missing built CLI binary at $cliBin"
          }
          if (-not $env:WINTUN_DLL_PATH -or -not (Test-Path -LiteralPath $env:WINTUN_DLL_PATH)) {
            throw "WINTUN_DLL_PATH is missing or invalid: '$($env:WINTUN_DLL_PATH)'"
          }
          if (-not $env:WINTUN_LICENSE_PATH -or -not (Test-Path -LiteralPath $env:WINTUN_LICENSE_PATH)) {
            throw "WINTUN_LICENSE_PATH is missing or invalid: '$($env:WINTUN_LICENSE_PATH)'"
          }

          $tauriConf = Get-Content -LiteralPath 'desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $expectedVersion = [string]$tauriConf.version
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw "Missing version in desktop/src-tauri/tauri.conf.json"
          }

          $rootCargoRaw = Get-Content -LiteralPath 'Cargo.toml' -Raw
          $rootCargoMatch = [regex]::Match($rootCargoRaw, '(?ms)^\[workspace\.package\]\s*(?:(?!^\[).)*?^version\s*=\s*"([^"]+)"')
          if (-not $rootCargoMatch.Success) {
            throw "Could not read [workspace.package] version from Cargo.toml"
          }
          $workspaceCargoVersion = $rootCargoMatch.Groups[1].Value
          if ($expectedVersion -ne $workspaceCargoVersion) {
            throw "Version mismatch: desktop/src-tauri/tauri.conf.json ($expectedVersion) != Cargo.toml ($workspaceCargoVersion)"
          }

          $desktopCargoRaw = Get-Content -LiteralPath 'desktop/src-tauri/Cargo.toml' -Raw
          $desktopCargoMatch = [regex]::Match($desktopCargoRaw, '(?ms)^\[package\]\s*(?:(?!^\[).)*?^version\s*=\s*"([^"]+)"')
          if (-not $desktopCargoMatch.Success) {
            throw "Could not read [package] version from desktop/src-tauri/Cargo.toml"
          }
          $desktopCargoVersion = $desktopCargoMatch.Groups[1].Value
          if ($expectedVersion -ne $desktopCargoVersion) {
            throw "Version mismatch: desktop/src-tauri/tauri.conf.json ($expectedVersion) != desktop/src-tauri/Cargo.toml ($desktopCargoVersion)"
          }

          $cliVersionOut = (& $cliBin --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "$cliBin --version failed with exit code $LASTEXITCODE`: $cliVersionOut"
          }
          if ($cliVersionOut -notmatch "(?:^|\s)$([regex]::Escape($expectedVersion))(?:\s|$)") {
            throw "CLI version mismatch: '$cliVersionOut' does not contain expected version '$expectedVersion'"
          }
          Write-Host "Verified vdpi.exe --version ('$cliVersionOut') matches tauri.conf.json ($expectedVersion), Cargo.toml ($workspaceCargoVersion), and desktop/src-tauri/Cargo.toml ($desktopCargoVersion)"
      - name: Build Tauri Desktop App (Windows Portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VDPI_EMBED_WINTUN_DLL) {
            throw "VDPI_EMBED_WINTUN_DLL must not be set for official Windows desktop builds"
          }
          npm --prefix desktop/ui run build
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop UI build failed with exit code $LASTEXITCODE"
          }

          $bundleConfig = Join-Path $env:RUNNER_TEMP 'tauri-windows-portable.json'
          @{
            build = @{
              beforeBuildCommand = ''
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $bundleConfig -Encoding utf8NoBOM

          npx --prefix desktop/ui tauri build --config $bundleConfig --no-bundle --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE -ne 0) {
            throw "tauri build failed with exit code $LASTEXITCODE"
          }
      - name: Package Windows Desktop Portable Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedDllSha256 = 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'
          if (-not $env:WINTUN_DLL_PATH -or -not (Test-Path -LiteralPath $env:WINTUN_DLL_PATH)) {
            throw "WINTUN_DLL_PATH is missing or invalid: '$($env:WINTUN_DLL_PATH)'"
          }
          if (-not $env:WINTUN_LICENSE_PATH -or -not (Test-Path -LiteralPath $env:WINTUN_LICENSE_PATH)) {
            throw "WINTUN_LICENSE_PATH is missing or invalid: '$($env:WINTUN_LICENSE_PATH)'"
          }

          $desktopBin = 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/vdpi-desktop.exe'
          $cliBin = 'target/x86_64-pc-windows-msvc/release/vdpi.exe'

          if (-not (Test-Path -LiteralPath $desktopBin)) {
            throw "Missing built desktop binary at $desktopBin"
          }
          if (-not (Test-Path -LiteralPath $cliBin)) {
            throw "Missing built CLI binary at $cliBin"
          }

          Remove-Item -LiteralPath dist/desktop-win, dist/desktop-win-portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist/desktop-win, dist/desktop-win-portable | Out-Null

          Copy-Item -LiteralPath $desktopBin -Destination dist/desktop-win-portable/vdpi-desktop.exe
          Copy-Item -LiteralPath $cliBin -Destination dist/desktop-win-portable/vdpi.exe
          Copy-Item -LiteralPath $env:WINTUN_DLL_PATH -Destination dist/desktop-win-portable/wintun.dll
          Copy-Item -LiteralPath $env:WINTUN_LICENSE_PATH -Destination dist/desktop-win-portable/WINTUN-LICENSE.txt

          Compress-Archive -Path dist/desktop-win-portable/* -DestinationPath dist/desktop-win/vdpi-desktop-windows-x86_64-portable.zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'dist/desktop-win/vdpi-desktop-windows-x86_64-portable.zip').Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName })
            $expected = @('vdpi-desktop.exe', 'vdpi.exe', 'wintun.dll', 'WINTUN-LICENSE.txt')
            $diff = @(Compare-Object -ReferenceObject $expected -DifferenceObject $entries -CaseSensitive)
            if ($entries.Count -ne $expected.Count -or $diff.Count -ne 0) {
              throw "Expected vdpi-desktop-windows-x86_64-portable.zip to contain $($expected -join ', '), got: $($entries -join ', ')"
            }

            $wintunEntry = $zip.GetEntry('wintun.dll')
            if (-not $wintunEntry) {
              throw "Missing wintun.dll entry in vdpi-desktop-windows-x86_64-portable.zip"
            }
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            $entryStream = $wintunEntry.Open()
            try {
              $hashBytes = $sha256.ComputeHash($entryStream)
              $actualPortableDllSha256 = ([System.BitConverter]::ToString($hashBytes) -replace '-', '').ToLowerInvariant()
            } finally {
              $entryStream.Dispose()
              $sha256.Dispose()
            }
            if ($actualPortableDllSha256 -ne $expectedDllSha256) {
              throw "Portable zip wintun.dll SHA-256 mismatch: expected $expectedDllSha256, got $actualPortableDllSha256"
            }
          } finally {
            $zip.Dispose()
          }
          Write-Host "Verified Windows desktop portable archive (vdpi-desktop.exe + vdpi.exe + SHA-256-verified wintun.dll [$actualPortableDllSha256] + WINTUN-LICENSE.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-windows
          path: |
            dist/desktop-win/vdpi-desktop-windows-x86_64-portable.zip

  build-desktop-macos:
    name: Build Desktop GUI (macOS Universal)
    needs: [test, test-desktop]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> desktop/src-tauri/target
          shared-key: desktop-macos
      - name: Build & Stage Universal macOS CLI Engine Binary (vdpi)
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-apple-darwin --bin vdpi
          cargo build --locked --release --target x86_64-apple-darwin --bin vdpi
          rm -rf desktop/src-tauri/resources
          mkdir -p desktop/src-tauri/resources
          lipo -create -output desktop/src-tauri/resources/vdpi \
            target/aarch64-apple-darwin/release/vdpi \
            target/x86_64-apple-darwin/release/vdpi
          chmod 755 desktop/src-tauri/resources/vdpi
          codesign -fs - desktop/src-tauri/resources/vdpi
          CLI_ARCHS="$(lipo -archs desktop/src-tauri/resources/vdpi)"
          echo "Staged universal vdpi CLI architectures: $CLI_ARCHS"
          printf '%s\n' "$CLI_ARCHS" | grep -q "arm64"
          printf '%s\n' "$CLI_ARCHS" | grep -q "x86_64"
      - name: Install Desktop UI Dependencies & Verify Pinned Tauri CLI
        run: |
          set -euo pipefail
          npm --prefix desktop/ui ci
          npx --prefix desktop/ui tauri --version
      - name: Build Tauri Desktop Universal App & DMG
        run: |
          set -euo pipefail
          npm --prefix desktop/ui run build
          BUNDLE_CONFIG="${RUNNER_TEMP}/tauri-macos-resources.json"
          cat > "$BUNDLE_CONFIG" <<'EOF'
          {
            "build": {
              "beforeBuildCommand": ""
            },
            "bundle": {
              "resources": {
                "resources/vdpi": "vdpi"
              }
            }
          }
          EOF
          npx --prefix desktop/ui tauri build \
            --config "$BUNDLE_CONFIG" \
            --target universal-apple-darwin \
            --bundles app,dmg \
            -- --locked
      - name: Verify & Package macOS Universal DMG
        run: |
          set -euo pipefail
          BIN_PATH="desktop/src-tauri/target/universal-apple-darwin/release/vdpi-desktop"
          APP_DIR="desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/vdpi Desktop.app"
          APP_BIN="${APP_DIR}/Contents/MacOS/vdpi-desktop"
          BUNDLED_CLI="${APP_DIR}/Contents/Resources/vdpi"

          test -f "$BIN_PATH"
          test -f "$APP_BIN"
          test -x "$BUNDLED_CLI"

          ARCHS="$(lipo -archs "$BIN_PATH")"
          echo "Universal desktop binary architectures: $ARCHS"
          printf '%s\n' "$ARCHS" | grep -q "arm64"
          printf '%s\n' "$ARCHS" | grep -q "x86_64"

          APP_ARCHS="$(lipo -archs "$APP_BIN")"
          echo "Bundled app vdpi-desktop architectures: $APP_ARCHS"
          printf '%s\n' "$APP_ARCHS" | grep -q "arm64"
          printf '%s\n' "$APP_ARCHS" | grep -q "x86_64"

          BUNDLED_CLI_ARCHS="$(lipo -archs "$BUNDLED_CLI")"
          echo "Bundled app vdpi CLI architectures: $BUNDLED_CLI_ARCHS"
          printf '%s\n' "$BUNDLED_CLI_ARCHS" | grep -q "arm64"
          printf '%s\n' "$BUNDLED_CLI_ARCHS" | grep -q "x86_64"

          DMG_FILE="$(find desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [ -z "$DMG_FILE" ] || [ ! -s "$DMG_FILE" ]; then
            echo "ERROR: Missing universal macOS DMG bundle" >&2
            exit 1
          fi

          DMG_STAGE=""
          MOUNT_DIR=""
          MOUNTED=0
          cleanup_macos_dmg() {
            if [ "$MOUNTED" = "1" ] && [ -n "$MOUNT_DIR" ]; then
              hdiutil detach "$MOUNT_DIR" -force >/dev/null 2>&1 || true
            fi
            if [ -n "$MOUNT_DIR" ]; then
              rm -rf "$MOUNT_DIR"
            fi
            if [ -n "$DMG_STAGE" ]; then
              rm -rf "$DMG_STAGE"
            fi
          }
          trap cleanup_macos_dmg EXIT

          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --deep --sign - "$APP_DIR"
          fi
          codesign --verify --deep --strict "$APP_DIR"

          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            DMG_STAGE="$(mktemp -d "${RUNNER_TEMP}/vdpi-dmg-stage.XXXXXX")"
            ditto "$APP_DIR" "${DMG_STAGE}/vdpi Desktop.app"
            ln -s /Applications "${DMG_STAGE}/Applications"
            hdiutil create -volname "vdpi Desktop" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG_FILE"
          fi

          MOUNT_DIR="$(mktemp -d "${RUNNER_TEMP}/vdpi-dmg-mount.XXXXXX")"
          hdiutil attach "$DMG_FILE" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          MOUNTED=1

          DMG_APP="${MOUNT_DIR}/vdpi Desktop.app"
          DMG_CLI="${DMG_APP}/Contents/Resources/vdpi"
          test -d "$DMG_APP"
          test -x "$DMG_CLI"
          codesign --verify --deep --strict "$DMG_APP"

          DMG_CLI_ARCHS="$(lipo -archs "$DMG_CLI")"
          echo "DMG-mounted vdpi CLI architectures: $DMG_CLI_ARCHS"
          printf '%s\n' "$DMG_CLI_ARCHS" | grep -q "arm64"
          printf '%s\n' "$DMG_CLI_ARCHS" | grep -q "x86_64"

          EXPECTED_VERSION="$(node -e "const v = require('./desktop/src-tauri/tauri.conf.json').version; if (typeof v !== 'string' || !v.trim()) process.exit(1); process.stdout.write(v.trim());")"
          DMG_CLI_VERSION="$("$DMG_CLI" --version)"
          echo "DMG-mounted vdpi CLI --version: $DMG_CLI_VERSION"
          case " $DMG_CLI_VERSION " in
            *" ${EXPECTED_VERSION} "*) ;;
            *)
              echo "ERROR: DMG-mounted vdpi CLI version '$DMG_CLI_VERSION' does not contain expected version '$EXPECTED_VERSION'" >&2
              exit 1
              ;;
          esac

          hdiutil detach "$MOUNT_DIR" -force
          MOUNTED=0

          mkdir -p dist/desktop-mac
          cp "$DMG_FILE" dist/desktop-mac/vdpi-desktop-macos-universal.dmg
          ls -lh dist/desktop-mac/vdpi-desktop-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-macos
          path: dist/desktop-mac/vdpi-desktop-macos-universal.dmg

  build-desktop-linux:
    name: Build Desktop GUI (Linux x86_64)
    needs: [test, test-desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> desktop/src-tauri/target
          shared-key: desktop-linux
      - name: Install WebKitGTK & Tauri System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            pkg-config \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Build & Stage Linux CLI Engine Binary (vdpi)
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-gnu --bin vdpi
          rm -rf desktop/src-tauri/resources
          mkdir -p desktop/src-tauri/resources
          cp target/x86_64-unknown-linux-gnu/release/vdpi desktop/src-tauri/resources/vdpi
          chmod 755 desktop/src-tauri/resources/vdpi
          test -x desktop/src-tauri/resources/vdpi
      - name: Install Desktop UI Dependencies & Verify Pinned Tauri CLI
        run: |
          set -euo pipefail
          npm --prefix desktop/ui ci
          npx --prefix desktop/ui tauri --version
      - name: Build Tauri Desktop Packages (.deb & .AppImage)
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          npm --prefix desktop/ui run build
          BUNDLE_CONFIG="${RUNNER_TEMP}/tauri-linux-resources.json"
          cat > "$BUNDLE_CONFIG" <<'EOF'
          {
            "build": {
              "beforeBuildCommand": ""
            },
            "bundle": {
              "resources": {
                "resources/vdpi": "vdpi"
              }
            }
          }
          EOF
          npx --prefix desktop/ui tauri build \
            --config "$BUNDLE_CONFIG" \
            --target x86_64-unknown-linux-gnu \
            --bundles deb,appimage \
            -- --locked
      - name: Verify & Package Linux Desktop Artifacts
        run: |
          set -euo pipefail
          DEB_FILE="$(find desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          APPIMAGE_FILE="$(find desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          if [ -z "$DEB_FILE" ] || [ ! -s "$DEB_FILE" ]; then
            echo "ERROR: Missing Linux .deb bundle" >&2
            exit 1
          fi
          if [ -z "$APPIMAGE_FILE" ] || [ ! -s "$APPIMAGE_FILE" ]; then
            echo "ERROR: Missing Linux .AppImage bundle" >&2
            exit 1
          fi

          DEB_CONTENTS="$(dpkg-deb -c "$DEB_FILE")"
          if ! printf '%s\n' "$DEB_CONTENTS" | grep -E '^-rwx.*[[:space:]](\./)?usr/lib/vdpi Desktop/vdpi$' >/dev/null; then
            echo "ERROR: Linux .deb bundle is missing executable 'usr/lib/vdpi Desktop/vdpi' (expected ^-rwx mode)" >&2
            printf '%s\n' "$DEB_CONTENTS" >&2
            exit 1
          fi
          echo "Verified executable 'usr/lib/vdpi Desktop/vdpi' in $DEB_FILE"

          DEB_DEPENDS="$(dpkg-deb -f "$DEB_FILE" Depends)"
          echo "Linux .deb Depends: $DEB_DEPENDS"
          DEB_DEP_PKGS="$(printf '%s\n' "$DEB_DEPENDS" | tr ',|' '\n' | awk '{print $1}')"
          for dep in libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 xdg-utils; do
            if ! printf '%s\n' "$DEB_DEP_PKGS" | grep -Fx "$dep" >/dev/null; then
              echo "ERROR: Linux .deb Depends is missing required package '$dep': $DEB_DEPENDS" >&2
              exit 1
            fi
          done
          echo "Verified Linux .deb Depends includes libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, and xdg-utils"

          DEB_RECOMMENDS="$(dpkg-deb -f "$DEB_FILE" Recommends)"
          echo "Linux .deb Recommends: $DEB_RECOMMENDS"
          if ! printf '%s\n' "$DEB_RECOMMENDS" | grep -E '(^|,)[[:space:]]*pkexec([[:space:]]*\([^)]*\))?[[:space:]]*\|[[:space:]]*policykit-1([[:space:]]*\([^)]*\))?[[:space:]]*(,|$)' >/dev/null; then
            echo "ERROR: Linux .deb Recommends is missing required 'pkexec | policykit-1': $DEB_RECOMMENDS" >&2
            exit 1
          fi
          echo "Verified Linux .deb Recommends includes pkexec | policykit-1"

          APPIMAGE_ABS="$(realpath "$APPIMAGE_FILE")"
          chmod 755 "$APPIMAGE_ABS"
          APPIMAGE_INSPECT_DIR="$(mktemp -d "${RUNNER_TEMP}/vdpi-appimage-inspect.XXXXXX")"
          trap 'rm -rf "$APPIMAGE_INSPECT_DIR"' EXIT
          (cd "$APPIMAGE_INSPECT_DIR" && "$APPIMAGE_ABS" --appimage-extract >/dev/null)
          APPIMAGE_CLI="${APPIMAGE_INSPECT_DIR}/squashfs-root/usr/lib/vdpi Desktop/vdpi"
          if [ ! -x "$APPIMAGE_CLI" ]; then
            echo "ERROR: Linux .AppImage is missing executable 'squashfs-root/usr/lib/vdpi Desktop/vdpi'" >&2
            find "${APPIMAGE_INSPECT_DIR}/squashfs-root/usr/lib" -maxdepth 3 2>/dev/null >&2 || true
            exit 1
          fi
          EXPECTED_VERSION="$(node -e "const v = require('./desktop/src-tauri/tauri.conf.json').version; if (typeof v !== 'string' || !v.trim()) process.exit(1); process.stdout.write(v.trim());")"
          APPIMAGE_CLI_VERSION="$("$APPIMAGE_CLI" --version)"
          echo "AppImage-extracted vdpi CLI --version: $APPIMAGE_CLI_VERSION"
          case " $APPIMAGE_CLI_VERSION " in
            *" ${EXPECTED_VERSION} "*) ;;
            *)
              echo "ERROR: AppImage-extracted vdpi CLI version '$APPIMAGE_CLI_VERSION' does not contain expected version '$EXPECTED_VERSION'" >&2
              exit 1
              ;;
          esac
          echo "Verified executable 'squashfs-root/usr/lib/vdpi Desktop/vdpi' (version $EXPECTED_VERSION) in $APPIMAGE_FILE"

          mkdir -p dist/desktop-linux
          cp "$DEB_FILE" dist/desktop-linux/vdpi-desktop-linux-x86_64.deb
          cp "$APPIMAGE_FILE" dist/desktop-linux/vdpi-desktop-linux-x86_64.AppImage
          chmod 755 dist/desktop-linux/vdpi-desktop-linux-x86_64.AppImage
          ls -lh dist/desktop-linux/
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-linux
          path: |
            dist/desktop-linux/vdpi-desktop-linux-x86_64.deb
            dist/desktop-linux/vdpi-desktop-linux-x86_64.AppImage

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-linux
      - build-android
      - build-ios
      - build-desktop-windows
      - build-desktop-macos
      - build-desktop-linux
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Tag & Manifest Version Parity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ.get("RELEASE_TAG", "").strip()
          if not tag.startswith("v"):
              sys.exit(f"ERROR: Release tag '{tag}' must start with 'v'")
          expected = tag[1:]

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          desktop_cargo = tomllib.loads(pathlib.Path("desktop/src-tauri/Cargo.toml").read_text(encoding="utf-8"))
          tauri_conf = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          ui_pkg = json.loads(pathlib.Path("desktop/ui/package.json").read_text(encoding="utf-8"))
          ios_yml = pathlib.Path("ios/project.yml").read_text(encoding="utf-8")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          ios_match = re.search(r'^\s*MARKETING_VERSION:\s*"?([^"\s#]+)"?\s*$', ios_yml, re.M)
          if not ios_match:
              sys.exit("ERROR: Could not read MARKETING_VERSION from ios/project.yml")

          changelog_match = re.search(r'^## \[([0-9]+\.[0-9]+\.[0-9]+[^\]]*)\]', changelog, re.M)
          if not changelog_match:
              sys.exit("ERROR: Could not find latest version heading in CHANGELOG.md")

          versions = {
              f"tag ({tag})": expected,
              "Cargo.toml": cargo["workspace"]["package"]["version"],
              "desktop/src-tauri/Cargo.toml": desktop_cargo["package"]["version"],
              "desktop/src-tauri/tauri.conf.json": tauri_conf["version"],
              "desktop/ui/package.json": ui_pkg["version"],
              "ios/project.yml": ios_match.group(1),
              "CHANGELOG.md": changelog_match.group(1),
          }

          for name, ver in versions.items():
              print(f"  {name}: {ver}")

          mismatches = {k: v for k, v in versions.items() if v != expected}
          if mismatches:
              sys.exit(f"ERROR: Release tag '{tag}' does not match manifests: {mismatches}")

          print(f"Verified release tag {tag} matches all manifests ({expected})")
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate Checksums & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          TAG_TYPE="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)"
          RAW_TAG_NOTES=""
          TRIMMED_TAG_NOTES=""
          if [ "$TAG_TYPE" = "tag" ]; then
            RAW_TAG_NOTES="$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}")"
            TRIMMED_TAG_NOTES="$(printf '%s\n' "$RAW_TAG_NOTES" | sed '/^[[:space:]]*$/d' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          if [ -n "$TRIMMED_TAG_NOTES" ] && [ "$TRIMMED_TAG_NOTES" != "vdpi $TAG" ] && [ "$TRIMMED_TAG_NOTES" != "$TAG" ]; then
            printf '%s\n' "$RAW_TAG_NOTES" \
              | awk -v tag="$TAG" '
                  BEGIN { started = 0 }
                  !started && /^[[:space:]]*$/ { next }
                  !started && ($0 == ("vdpi " tag) || $0 == tag || $0 == "### Changes") { next }
                  { started = 1; lines[++n] = $0 }
                  END {
                    while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
                    for (i = 1; i <= n; i++) print lines[i]
                  }
                ' > release-changes.md
          else
            VER="${TAG#v}"
            awk -v ver="$VER" '
              BEGIN { in_sec = 0; target = "## [" ver "]" }
              index($0, target) == 1 { in_sec = 1; next }
              in_sec && index($0, "## [") == 1 { exit }
              in_sec && /^(  )?- / { print }
            ' CHANGELOG.md > release-changes.md || true
            if [ ! -s release-changes.md ]; then
              PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
              if [ -n "$PREV_TAG" ]; then
                git log --no-merges --pretty=tformat:'- %s' "${PREV_TAG}..${TAG}" \
                  | grep -Ev '^- (fix|chore|ci)\(ci\):' > release-changes.md || true
              else
                git log --no-merges -n 20 --pretty=tformat:'- %s' "$TAG" \
                  | grep -Ev '^- (fix|chore|ci)\(ci\):' > release-changes.md || true
              fi
            fi
          fi
          if [ ! -s release-changes.md ]; then
            printf '%s\n' "- Release $TAG" > release-changes.md
          fi

          BASE_URL="https://github.com/${GH_REPO}/releases/download/${TAG}"
          {
            printf '### Changes\n\n'
            cat release-changes.md
            printf '\n'
            sed "s|__BASE_URL__|${BASE_URL}|g" <<'EOF'
          ### Which Download Should I Pick?

          Most users only need **one** download:
          - **Want a normal app with a window and tray icon?** Pick **Desktop App (GUI)** below - it already includes the `vdpi` engine and `wintun.dll` (you do not need the TUI/CLI archive separately).
          - **Prefer the terminal Control Center TUI or headless CLI?** Pick **Terminal / TUI (CLI)** below.
          - **On a phone or tablet?** Pick **Mobile** below.

          #### Desktop App (GUI) - Recommended for most users
          Full native app window, visual Split Tunneling, DNS & Rules, Diagnostics, system tray, and 1-click setup.

          | Platform | Download | Notes |
          | :--- | :--- | :--- |
          | **Windows** (`x86_64`) | [vdpi-desktop-windows-x86_64-portable.zip](__BASE_URL__/vdpi-desktop-windows-x86_64-portable.zip) | Unzip and run `vdpi-desktop.exe` (includes `vdpi.exe` + `wintun.dll`) |
          | **macOS** (Apple Silicon & Intel) | [vdpi-desktop-macos-universal.dmg](__BASE_URL__/vdpi-desktop-macos-universal.dmg) | Open DMG and drag `vdpi Desktop` to Applications |
          | **Linux** (Debian / Ubuntu `x86_64`) | [vdpi-desktop-linux-x86_64.deb](__BASE_URL__/vdpi-desktop-linux-x86_64.deb) | Install via `sudo apt install ./vdpi-desktop-linux-x86_64.deb` |
          | **Linux** (Any distro `x86_64`) | [vdpi-desktop-linux-x86_64.AppImage](__BASE_URL__/vdpi-desktop-linux-x86_64.AppImage) | `chmod +x` and run directly |

          #### Terminal / TUI (CLI) - Lightweight, no GUI window
          Interactive terminal Control Center TUI + background service CLI (`vdpi`). Ideal for terminal users, scripts, or headless/ARM64 Linux.

          | Platform | Download | Notes |
          | :--- | :--- | :--- |
          | **Windows** (`x86_64`) | [vdpi-windows-x86_64.zip](__BASE_URL__/vdpi-windows-x86_64.zip) | `vdpi.exe` + `wintun.dll` |
          | **macOS** (Apple Silicon & Intel) | [vdpi-macos-universal.tar.gz](__BASE_URL__/vdpi-macos-universal.tar.gz) | Universal binary (`arm64` + `x86_64`) |
          | **Linux** (`x86_64`) | [vdpi-linux-x86_64.tar.gz](__BASE_URL__/vdpi-linux-x86_64.tar.gz) | Static `musl` binary |
          | **Linux** (`arm64`) | [vdpi-linux-arm64.tar.gz](__BASE_URL__/vdpi-linux-arm64.tar.gz) | Static `musl` binary (Raspberry Pi / ARM servers) |

          #### Mobile
          Zero-root local VPN apps sharing the same Rust core.

          | Platform | Download | Notes |
          | :--- | :--- | :--- |
          | **Android** (`8.0+`, universal) | [vdpi-android-universal.apk](__BASE_URL__/vdpi-android-universal.apk) | Signed APK (`arm64-v8a` / `armeabi-v7a` / `x86_64`) |
          | **iOS / iPadOS** (`16+`, unsigned) | [vdpi-ios-unsigned.ipa](__BASE_URL__/vdpi-ios-unsigned.ipa) | For TrollStore or paid Apple Developer signing (`NetworkExtension`) |

          Verify downloads with [SHA256SUMS.txt](__BASE_URL__/SHA256SUMS.txt).
          EOF
          } > release-notes.md

          cd release-assets
          FORBIDDEN_ASSETS="$(find . -type f \( -iname '*.exe' -o -iname '*setup*' -o -iname '*nsis*' -o -iname '*.msi' \) | sort)"
          if [ -n "$FORBIDDEN_ASSETS" ]; then
            echo "ERROR: Forbidden Windows installer/executable artifact(s) found in release-assets:" >&2
            printf '%s\n' "$FORBIDDEN_ASSETS" >&2
            exit 1
          fi

          EXPECTED_WINTUN_SHA256="e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce"
          WINTUN_VERIFY_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/vdpi-wintun-verify.XXXXXX")"
          trap 'rm -rf "$WINTUN_VERIFY_DIR"' EXIT
          for win_zip in vdpi-windows-x86_64.zip vdpi-desktop-windows-x86_64-portable.zip; do
            zip_tmp="${WINTUN_VERIFY_DIR}/${win_zip%.zip}"
            mkdir -p "$zip_tmp"
            unzip -q -o "$win_zip" wintun.dll -d "$zip_tmp"
            test -s "${zip_tmp}/wintun.dll"
            actual_wintun_sha="$(sha256sum "${zip_tmp}/wintun.dll" | awk '{print $1}')"
            if [ "$actual_wintun_sha" != "$EXPECTED_WINTUN_SHA256" ]; then
              echo "ERROR: ${win_zip} wintun.dll SHA-256 mismatch: expected ${EXPECTED_WINTUN_SHA256}, got ${actual_wintun_sha}" >&2
              exit 1
            fi
            echo "Verified ${win_zip} wintun.dll SHA-256 (${actual_wintun_sha})"
          done

          ASSETS=(
            vdpi-windows-x86_64.zip
            vdpi-macos-universal.tar.gz
            vdpi-linux-x86_64.tar.gz
            vdpi-linux-arm64.tar.gz
            vdpi-android-universal.apk
            vdpi-ios-unsigned.ipa
            vdpi-desktop-windows-x86_64-portable.zip
            vdpi-desktop-macos-universal.dmg
            vdpi-desktop-linux-x86_64.deb
            vdpi-desktop-linux-x86_64.AppImage
          )
          sha256sum "${ASSETS[@]}" > SHA256SUMS.txt
          printf '%s  wintun.dll\n' "$EXPECTED_WINTUN_SHA256" >> SHA256SUMS.txt
          test ! -e wintun.dll
          grep -Fx "${EXPECTED_WINTUN_SHA256}  wintun.dll" SHA256SUMS.txt >/dev/null
          sha256sum --ignore-missing -c SHA256SUMS.txt

          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              $PRERELEASE_FLAG \
              --title "vdpi $TAG" \
              --notes-file ../release-notes.md
            gh release upload "$TAG" --clobber \
              "${ASSETS[@]}" \
              SHA256SUMS.txt
          else
            gh release create "$TAG" \
              $PRERELEASE_FLAG \
              --title "vdpi $TAG" \
              --notes-file ../release-notes.md \
              "${ASSETS[@]}" \
              SHA256SUMS.txt
          fi

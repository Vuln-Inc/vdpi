[workspace]
members = [".", "crates/vdpi-tun", "crates/vdpi-android", "crates/vdpi-ios"]
default-members = ["."]

[workspace.package]
version = "0.3.4"
edition = "2021"
authors = ["Vuln-Inc"]
license = "MIT"
repository = "https://github.com/Vuln-Inc/vdpi"
homepage = "https://github.com/Vuln-Inc/vdpi"

[package]
name = "vdpi"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Zero-hassle, self-healing anti-DPI engine in Rust - native across Windows, macOS, Linux, Android, and iOS"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["dpi", "proxy", "socks5", "doh", "network"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
bytes = "1.9"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep unwinding enabled so FFI/JNI std::panic::catch_unwind guards in
# vdpi-android and vdpi-ios actually prevent panics from aborting mobile hosts.
panic = "unwind"

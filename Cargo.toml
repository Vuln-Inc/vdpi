[workspace]
resolver = "2"
members = [
    "crates/vdpi",
    "crates/vdpi-tun",
    "crates/vdpi-android",
    "crates/vdpi-ios",
]
default-members = ["crates/vdpi"]

[workspace.package]
version = "0.3.4"
edition = "2021"
authors = ["Vuln-Inc"]
license = "MIT"
repository = "https://github.com/Vuln-Inc/vdpi"
homepage = "https://github.com/Vuln-Inc/vdpi"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep unwinding enabled so FFI/JNI std::panic::catch_unwind guards in
# vdpi-android and vdpi-ios actually prevent panics from aborting mobile hosts.
panic = "unwind"

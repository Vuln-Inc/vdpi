[workspace]
resolver = "2"
members = [
    "core/engine",
    "core/tun",
    "core",
    "android/native",
    "ios/native",
]
default-members = ["core"]

[workspace.package]
version = "0.5.6"
edition = "2021"
authors = ["Vuln-Inc"]
license = "MIT"
repository = "https://github.com/Vuln-Inc/vdpi"
homepage = "https://github.com/Vuln-Inc/vdpi"

[workspace.dependencies]
vdpi-core = { version = "0.5.6", path = "core/engine" }
vdpi-tun = { version = "0.5.6", path = "core/tun" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep unwinding enabled so FFI/JNI std::panic::catch_unwind guards in
# vdpi-android and vdpi-ios actually prevent panics from aborting mobile hosts.
panic = "unwind"
